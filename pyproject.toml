[project]
name = "elizur"
version = "0.3.0"
description = "Elizur is a finance library for actuaries, finance professionals, and students"
authors = [{ name = "Tanner Rollefson", email = "trollefson@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
]
dependencies = [
    "numpy>=1.18",
    "polars>=1.0",
]

[project.urls]
Repository = "https://github.com/trollefson/elizur"

[build-system]
requires = ["uv_build>=0.5,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["sphinx"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
no-matching-overload = "ignore"

[[tool.ty.overrides]]
include = ["src/elizur/life/annuity/annuity.py", "src/elizur/life/table/table.py"]
rules.unsupported-operator = "ignore"
rules.invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["src/elizur/life/util/validators.py"]
rules.unresolved-attribute = "ignore"
rules.invalid-return-type = "ignore"
